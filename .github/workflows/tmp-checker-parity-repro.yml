name: tmp-checker-parity-repro
on:
  push:
    branches: [fix/checker-parser-parity-20260809]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce file-vs-directory parity gap
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP ('starter-dir-repro-' + [guid]::NewGuid().ToString('N'))
          $root = Join-Path $sandbox 'repo'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'docs\DIR_TARGET') | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'AGENTS.md') -Value 'router' -Encoding UTF8
          @"
DIR|docs/DIR_TARGET|directory target should not be valid
RETRIEVAL_MAP|docs/RETRIEVAL_MAP.md|resolver
"@ | Set-Content -LiteralPath (Join-Path $root 'docs\RETRIEVAL_MAP.md') -Encoding UTF8

          python tools/check_docs.py --root $root
          $pyCode = $LASTEXITCODE
          & tools/check_docs.ps1 -Root $root
          $psCode = $LASTEXITCODE
          Write-Host "python_directory_code=$pyCode"
          Write-Host "powershell_directory_code=$psCode"
          if ($pyCode -eq 0) { throw 'Python unexpectedly accepted directory target' }
          if ($psCode -ne 0) { throw 'PowerShell already rejects directory target; parity defect not reproduced' }
          Write-Host 'DIRECTORY-PARITY-REPRO: PASS'

      - name: Reproduce malformed-row fail-open gap
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP ('starter-malformed-repro-' + [guid]::NewGuid().ToString('N'))
          $root = Join-Path $sandbox 'repo'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'docs') | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'AGENTS.md') -Value 'router' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $root 'docs\REAL.md') -Value 'real' -Encoding UTF8
          @"
# Retrieval Map

## Resolver Table
REAL|docs/REAL.md|valid
BROKEN_TOO_FEW|docs/REAL.md
BROKEN_TOO_MANY|docs/REAL.md|role|extra
RETRIEVAL_MAP|docs/RETRIEVAL_MAP.md|resolver
"@ | Set-Content -LiteralPath (Join-Path $root 'docs\RETRIEVAL_MAP.md') -Encoding UTF8

          python tools/check_docs.py --root $root
          $pyCode = $LASTEXITCODE
          & tools/check_docs.ps1 -Root $root
          $psCode = $LASTEXITCODE
          Write-Host "python_malformed_code=$pyCode"
          Write-Host "powershell_malformed_code=$psCode"
          if ($pyCode -ne 0 -or $psCode -ne 0) { throw 'One checker already rejects malformed resolver rows; expected current fail-open behavior' }
          Write-Host 'MALFORMED-ROW-REPRO: PASS'

      - name: Confirm current clean baseline
        shell: pwsh
        run: |
          python tools/check_docs.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/check_docs.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/check_docs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
