name: tmp-resolver-containment-validation
on:
  push:
    branches: [fix/resolver-path-containment-20260809]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python self-test
        run: python tools/check_docs.py --self-test
      - name: PowerShell self-test
        shell: pwsh
        run: ./tools/check_docs.ps1 -SelfTest
      - name: Clean repository check - Python
        run: python tools/check_docs.py
      - name: Clean repository check - PowerShell
        shell: pwsh
        run: ./tools/check_docs.ps1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python self-test
        run: python3 tools/check_docs.py --self-test
      - name: Clean repository check
        run: python3 tools/check_docs.py
