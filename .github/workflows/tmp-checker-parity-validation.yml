name: tmp-checker-parity-validation
on:
  push:
    branches:
      - fix/checker-parser-parity-20260809
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python and PowerShell self-tests
        shell: pwsh
        run: |
          python tools/check_docs.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/check_docs.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean repository parity
        shell: pwsh
        run: |
          python tools/check_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools/check_docs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python self-test and clean repository
        run: |
          python3 tools/check_docs.py --self-test
          python3 tools/check_docs.py
